<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Stray - StraySouls</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <!-- Google Maps script placeholder -->
    <style>
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-paw"></i> StraySouls
            </a>
            <div class="nav-toggle">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="report.html" class="active">Report Stray</a></li>

                <li><a href="adopt.html">Adopt</a></li>
                <li><a href="medical.html">Medical Help</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="heatmap.html">Heatmap</a></li>
                <li id="auth-links">
                    <!-- JS will populate -->
                </li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding: 3rem 20px;">
        <h1 class="text-center mb-2">Report a Stray Animal</h1>

        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <form onsubmit="handleReport(event)">

                <!-- 1. Photo Upload -->
                <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px;">1. Upload Photo</h3>
                <p id="model-loading-msg" style="color: #666; font-size: 0.9em; margin-bottom: 5px;">Loading animal detector...</p>
                <div class="upload-preview" onclick="document.getElementById('file-upload').click()">
                    <div id="preview-text" class="text-center">
                        <i class="fas fa-camera fa-2x mb-1"></i>
                        <p>Click to take a photo or upload</p>
                    </div>
                    <img id="image-preview" src="" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div id="verification-status" class="status-box hidden" style="margin-top: 10px; font-weight: 500;"></div>
                <input type="file" id="file-upload" accept="image/*" capture="camera" style="display: none;"
                    onchange="previewImage(this)">

                <!-- 2. Location -->
                <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 2rem;">2. Location</h3>
                <div class="form-group">
                    <button type="button" class="btn btn-outline mb-1" onclick="getLocation()">
                        <i class="fas fa-map-marker-alt"></i> Get Current Location
                    </button>
                    <p id="location-status" style="font-size: 0.9rem; color: #666;"></p>
                    <!-- Mock Map -->
                    <div class="map-placeholder" id="map-view">
                        Map View (Google Maps Integration)
                    </div>
                    <input type="text" class="form-control" id="address-input"
                        placeholder="Or enter manual address/landmark">
                </div>

                <!-- 3. Details -->
                <h3 style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 2rem;">3. Animal Details
                </h3>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label style="margin-bottom: 0;">Detected Animal Type</label>
                        <button type="button" class="btn btn-sm btn-outline" id="change-type-btn" style="padding: 2px 8px; font-size: 0.8rem; display: none;" onclick="toggleTypeSelection()">Not a <span id="btn-type-text">...</span>? Change</button>
                    </div>
                    
                    <div id="type-display-container">
                        <div id="animal-type-display" class="form-control" style="background: #f9f9f9; font-weight: 600; display: flex; align-items: center; gap: 10px;">
                            <span id="type-text">Pending Analysis...</span>
                        </div>
                    </div>

                    <select id="manual-animal-type" class="form-control" style="display: none;" onchange="updateManualType(this.value)">
                        <option value="dog">Dog</option>
                        <option value="cat">Cat</option>
                        <option value="bird">Bird</option>
                        <option value="cattle">Cattle (Cow/Buffalo)</option>
                        <option value="other">Other</option>
                    </select>

                    <input type="hidden" id="animal-type" value="other">
                </div>

                <div class="form-group">
                    <label>Number of Stray Animals *</label>
                    <div class="stray-count-wrapper">
                        <button type="button" class="btn-counter" onclick="adjustCount(-1)"><i class="fas fa-minus"></i></button>
                        <input type="number" id="numberOfStrays" class="form-control" name="numberOfStrays" min="1" max="50" value="1" required>
                        <button type="button" class="btn-counter" onclick="adjustCount(1)"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="routingHintBox" class="routing-hint-box hidden">
                        <i id="routingHintIcon" class="fas fa-info-circle"></i>
                        <span id="routingHintText"></span>
                    </div>
                </div>

                <div class="form-group urgency-selector">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Condition / Urgency</label>

                    <input type="radio" name="urgency" id="u-low" value="low" checked>
                    <label for="u-low" class="u-low">Healthy / Safe</label>

                    

                    <input type="radio" name="urgency" id="u-medium" value="medium">
                    <label for="u-medium" class="u-medium">Needs Shelter</label>

                    <input type="radio" name="urgency" id="u-high" value="high">
                    <label for="u-high" class="u-high">Injured / Critical</label>

                    <input type="radio" name="urgency" id="u-sterilization" value="sterilization">
                    <label for="u-sterilization" class="u-sterilization">Sterilization</label>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="report-description" class="form-control" rows="4"
                        placeholder="Describe the animal, situation, or specific needs..."></textarea>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary"
                    style="width: 100%; font-size: 1.1rem; padding: 15px;">Submit Report</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container footer-bottom">
            <p>&copy; <span id="current-year"></span> StraySouls.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/imageVerifier.js"></script>
    <script>
        const API_BASE = window.location.port === '3000' ? '' : 'http://localhost:3000';
        
        // Cache the AI analysis result so we don't call Gemini twice
        let cachedAiAnalysis = null;

        // Initial state
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('submit-btn').disabled = true;
        });

        document.addEventListener('animalModelLoaded', () => {
            const loadingMsg = document.getElementById('model-loading-msg');
            if(loadingMsg) loadingMsg.style.display = 'none';
        });

        // --- Routing Hint Listener ---
        const numberOfStraysInput = document.getElementById('numberOfStrays');
        const routingHintBox = document.getElementById('routingHintBox');
        const routingHintText = document.getElementById('routingHintText');
        const routingHintIcon = document.getElementById('routingHintIcon');

        function adjustCount(change) {
            let currentVal = parseInt(numberOfStraysInput.value) || 1;
            let newVal = currentVal + change;
            if (newVal >= 1 && newVal <= 50) {
                numberOfStraysInput.value = newVal;
                numberOfStraysInput.dispatchEvent(new Event('input'));
            }
        }

        numberOfStraysInput.addEventListener('input', () => {
            const count = parseInt(numberOfStraysInput.value);
            const sterilizationRadio = document.getElementById('u-sterilization');
            const sterilizationLabel = document.querySelector('label[for="u-sterilization"]');

            if (!count || count <= 0) {
                routingHintBox.className = "routing-hint-box hidden";
            } else if (count <= 2) {
                routingHintIcon.className = "fas fa-user-friends";
                routingHintText.innerHTML = "<strong>Local Volunteers Notified:</strong> Ideal for 1-2 animals.";
                routingHintBox.className = "routing-hint-box show routing-volunteers";
            } else {
                routingHintIcon.className = "fas fa-building";
                routingHintText.innerHTML = "<strong>Escalated to NGOs & Shelters:</strong> Mass rescue team required.";
                routingHintBox.className = "routing-hint-box show routing-shelters";
            }

            // Sterilization: only available when more than 2 strays
            if (count > 2) {
                sterilizationRadio.disabled = false;
                sterilizationLabel.style.opacity = '1';
                sterilizationLabel.style.cursor = 'pointer';
                sterilizationLabel.title = '';
            } else {
                sterilizationRadio.disabled = true;
                sterilizationLabel.style.opacity = '0.4';
                sterilizationLabel.style.cursor = 'not-allowed';
                sterilizationLabel.title = 'Sterilization requires more than 2 strays';
                // If sterilization was selected, reset to low
                if (sterilizationRadio.checked) {
                    document.getElementById('u-low').checked = true;
                }
            }
        });

        // Initialize hint on load
        setTimeout(() => {
            if(numberOfStraysInput.value) numberOfStraysInput.dispatchEvent(new Event('input'));
        }, 100);
        // --- End Routing Hint ---

        // Safe helper to update btn-type-text (it may not exist if user toggled)
        function setBtnTypeText(val) {
            const el = document.getElementById('btn-type-text');
            if (el) el.innerText = val;
        }

        function toggleTypeSelection() {
            const display = document.getElementById('type-display-container');
            const select = document.getElementById('manual-animal-type');
            const btn = document.getElementById('change-type-btn');
            const animalInput = document.getElementById('animal-type');
            
            if (select.style.display === 'none') {
                display.style.display = 'none';
                select.style.display = 'block';
                btn.innerHTML = '<span id="btn-type-text" style="display:none;"></span>Go back to AI detection';
                select.value = animalInput.value || 'other';
            } else {
                display.style.display = 'block';
                select.style.display = 'none';
                const currentType = (animalInput.value || 'Animal').toUpperCase();
                btn.innerHTML = `Not a <span id="btn-type-text">${currentType}</span>? Change`;
            }
        }

        function updateManualType(val) {
            const animalTypeEl = document.getElementById('animal-type');
            const typeTextEl   = document.getElementById('type-text');
            if (animalTypeEl) animalTypeEl.value = val;
            if (typeTextEl)   typeTextEl.innerHTML = `<i class="fas fa-paw"></i> ${val.toUpperCase()}`;
            setBtnTypeText(val.toUpperCase());
        }

        document.addEventListener('animalModelError', () => {
            const loadingMsg = document.getElementById('model-loading-msg');
            if(loadingMsg) {
                loadingMsg.style.color = 'red';
                loadingMsg.innerText = 'Verification unavailable — please ensure your image shows a stray animal';
            }
        });

        async function previewImage(input) {
            const statusEl = document.getElementById('verification-status');
            const previewEl = document.getElementById('image-preview');
            const previewText = document.getElementById('preview-text');
            const submitBtn = document.getElementById('submit-btn');

            // Reset cached analysis on new image
            cachedAiAnalysis = null;

            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = function (e) {
                    previewEl.src = e.target.result;
                    previewEl.style.display = 'block';
                    previewText.style.display = 'none';
                }
                reader.readAsDataURL(file);
                
                statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying image...';
                statusEl.className = 'status-box status-verifying';
                submitBtn.disabled = true;

                const result = await window.verifyAnimalImage(file);

                if (result.isAnimal) {
                    if (result.detectedClass === "unknown (fail-open)") {
                        statusEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Verification unavailable — proceed with submission.';
                        statusEl.className = 'status-box status-warning';
                    } else {
                        // AUTO-FILL ANIMAL TYPE
                        if (result.animalType) {
                            const typeInput = document.getElementById('animal-type');
                            const typeDisplay = document.getElementById('type-text');
                            const changeBtn = document.getElementById('change-type-btn');

                            typeInput.value = result.animalType;
                            typeDisplay.innerHTML = `<i class="fas fa-paw"></i> ${result.animalType.toUpperCase()}`;
                            setBtnTypeText(result.animalType.toUpperCase());
                            changeBtn.style.display = 'block';

                            statusEl.innerHTML = `<i class="fas fa-check-circle"></i> AI confirmed detection! Scanning for details...`;
                        } else {
                            statusEl.innerHTML = `<i class="fas fa-check"></i> Image verified successfully. Scanning for details...`;
                        }
                        statusEl.className = 'status-box status-success';
                    }
                    submitBtn.disabled = false;

                    // --- GENERATIVE AI ANALYSIS (Gemini) ---
                    try {
                        const descArea = document.getElementById('report-description');
                        if (descArea) {
                            descArea.placeholder = "AI is analyzing your photo and generating a description...";
                            descArea.disabled = true;
                        }

                        const formData = new FormData();
                        formData.append('image', file);
                        
                        const analysisRes = await fetch(`${API_BASE}/api/reports/analyze`, {
                            method: 'POST',
                            body: formData
                        });

                        if (analysisRes.ok) {
                            const data = await analysisRes.json();
                            if (data.success && data.analysis) {
                                const analysis = data.analysis;

                                // Cache the result so submit doesn't call Gemini again
                                cachedAiAnalysis = analysis;

                                if (descArea) {
                                    descArea.value = analysis.aiDescription || "";
                                    descArea.disabled = false;
                                }
                                
                                // Also update animal type if different/more specific
                                if (analysis.animalType && analysis.animalType !== 'other') {
                                    const typeInput   = document.getElementById('animal-type');
                                    const typeDisplay = document.getElementById('type-text');
                                    if (typeInput)   typeInput.value = analysis.animalType;
                                    if (typeDisplay) typeDisplay.innerHTML = `<i class="fas fa-paw"></i> ${analysis.animalType.toUpperCase()}`;
                                    setBtnTypeText(analysis.animalType.toUpperCase());
                                }

                                statusEl.innerHTML = `<i class="fas fa-magic"></i> AI Analysis complete! Description generated.`;
                                statusEl.className = 'status-box status-success';
                            }
                        } else {
                            if (descArea) {
                                descArea.placeholder = "Describe the animal, situation, or specific needs...";
                                descArea.disabled = false;
                            }
                        }
                    } catch (aiErr) {
                        console.error("AI Analysis failed:", aiErr);
                        const descArea = document.getElementById('report-description');
                        if (descArea) {
                            descArea.placeholder = "Describe the animal, situation, or specific needs...";
                            descArea.disabled = false;
                        }
                    }
                    // --- END AI ANALYSIS ---

                } else {
                    statusEl.innerHTML = "<i class=\"fas fa-times-circle\"></i> No animal detected. Please upload a clear photo of the stray.";
                    statusEl.className = "status-box status-error";
                    input.value = ""; // clear input
                    submitBtn.disabled = true;
                }
            }
        }

        function getLocation() {
            const status = document.getElementById('location-status');
            const mapView = document.getElementById('map-view');

            if (!navigator.geolocation) {
                status.textContent = "Geolocation is not supported by your browser";
                return;
            }

            status.textContent = "Locating...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    status.textContent = `Lat: ${lat}, Lng: ${lng}`;
                    window.currentLat = lat;
                    window.currentLng = lng;

                    status.innerHTML = `<i class="fas fa-check-circle text-success"></i> Location Captured Successfuly`;

                    mapView.innerHTML = `<iframe width="100%" height="100%" frameborder="0" style="border:0"
                        src="https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed">
                    </iframe>`;
                },
                () => {
                    status.textContent = "Unable to retrieve your location";
                }
            );
        }

        async function handleReport(e) {
            e.preventDefault();

            const fileInput = document.getElementById('file-upload');
            const animalType = document.getElementById('animal-type').value;
            const urgency = document.querySelector('input[name="urgency"]:checked').value;
            const description = document.getElementById('report-description').value.trim();
            const address = document.getElementById('address-input').value;

            // Validate image
            if (fileInput.files.length === 0) {
                showToast('Please upload a photo of the animal.', 'error');
                return;
            }

            // Validate location
            if (!window.currentLat || !window.currentLng) {
                showToast('Please capture your location first.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            formData.append('lat', window.currentLat);
            formData.append('lng', window.currentLng);
            formData.append('address', address);
            formData.append('animalType', animalType);
            formData.append('urgency', urgency);
            formData.append('description', description);
            formData.append('numberOfStrays', numberOfStraysInput.value);

            // Send cached AI analysis so the server doesn't re-call Gemini
            if (cachedAiAnalysis) {
                formData.append('cachedAiAnalysis', JSON.stringify(cachedAiAnalysis));
            }

            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = 'Submitting...';

            try {
                const token = localStorage.getItem('straySoulsToken');
                const response = await fetch(`${API_BASE}/api/reports`, {
                    method: 'POST',
                    headers: {
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: formData
                });

                if (response.ok) {
                    showToast('Report submitted successfully!', 'success');
                    delayedRedirect('dashboard.html');
                } else {
                    const error = await response.json();
                    showToast('Error: ' + error.error, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerText = originalText;
                }
            } catch (err) {
                console.error(err);
                showToast('Failed to submit report. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        }
    </script>
</body>

</html>
