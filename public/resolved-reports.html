<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolved Reports - StraySouls Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --resolved-green: #27ae60;
            --resolved-bg: #f0fdf4;
            --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .admin-container { display: flex; min-height: 100vh; background-color: #f8fafc; }
        .sidebar { width: 250px; background: #1e293b; color: white; padding: 2rem 1rem; position: fixed; height: 100%; z-index: 100; }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 2rem; color: #38bdf8; text-align: center; }
        .sidebar ul li { margin-bottom: 0.5rem; }
        .sidebar ul li a { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; transition: 0.3s; }
        .sidebar ul li a:hover, .sidebar ul li a.active { background: #334155; color: white; }
        .main-content { margin-left: 250px; flex: 1; padding: 2.5rem; width: calc(100% - 250px); }

        .dashboard-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2.5rem; }
        .header-info h1 { font-size: 2.2rem; color: #1e293b; margin-bottom: 0.5rem; }
        .header-info p { color: #64748b; font-size: 1.1rem; }
        
        .stats-summary { display: flex; gap: 20px; align-items: center; }
        .resolved-counter { background: white; padding: 1rem 1.5rem; border-radius: 12px; box-shadow: var(--card-shadow); border-left: 5px solid var(--resolved-green); }
        .resolved-counter span { display: block; font-size: 0.8rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .resolved-counter strong { font-size: 1.8rem; color: #1e293b; }

        .filters-bar { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: var(--card-shadow); margin-bottom: 2rem; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .filter-group { flex: 1; min-width: 180px; }
        .filter-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .filter-group input[type="date"] { padding: 9px; }
        .filter-control { width: 100%; padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; outline: none; transition: 0.3s; box-sizing: border-box; }
        .filter-control:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }

        .btn-export { background: #1e293b; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-export:hover { background: #334155; transform: translateY(-2px); }

        .resolved-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        
        .resolved-card { background: white; border-radius: 16px; box-shadow: var(--card-shadow); overflow: hidden; border: 1px solid #e2e8f0; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; }
        .resolved-card:hover { transform: scale(1.01); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .status-top { background: var(--resolved-bg); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dcfce7; }
        .status-label { color: var(--resolved-green); font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .urgency-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-high { background: #fee2e2; color: #b91c1c; }
        .badge-medium { background: #ffedd5; color: #9a3412; }
        .badge-low { background: #f0fdf4; color: #166534; }

        .card-content { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .img-stack { position: relative; }
        .img-stack p { font-size: 0.75rem; font-weight: 700; color: #64748b; margin-bottom: 8px; letter-spacing: 0.5px; }
        .resolved-img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; border: 2px solid #f1f5f9; cursor: zoom-in; transition: 0.3s; }
        .resolved-img:hover { opacity: 0.9; transform: scale(1.02); }
        
        .details-stack h3 { margin-bottom: 12px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        .info-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .info-item { flex: 1; min-width: 120px; }
        .info-item label { display: block; font-size: 0.7rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
        .info-item p { font-size: 0.95rem; color: #334155; font-weight: 500; }
        
        .volunteer-note { background: #f8fafc; padding: 15px; border-radius: 10px; font-style: italic; color: #475569; position: relative; border-left: 4px solid #cbd5e1; }
        .volunteer-note::before { content: '“'; position: absolute; top: -10px; left: 10px; font-size: 3rem; color: #e2e8f0; font-family: serif; }

        .timeline-box { padding: 20px; background: #fafafa; border-top: 1px solid #f1f5f9; display: none; }
        .timeline { display: flex; justify-content: space-between; position: relative; padding-top: 20px; }
        .timeline::after { content: ''; position: absolute; top: 32px; left: 0; right: 0; height: 3px; background: #e2e8f0; z-index: 1; }
        .timeline-step { position: relative; z-index: 2; text-align: center; flex: 1; }
        .step-marker { width: 24px; height: 24px; background: white; border: 3px solid #cbd5e1; border-radius: 50%; margin: 0 auto 8px; transition: 0.3s; }
        .timeline-step.active .step-marker { background: var(--resolved-green); border-color: var(--resolved-green); box-shadow: 0 0 0 5px rgba(39, 174, 96, 0.2); }
        .step-label { font-size: 0.7rem; font-weight: 700; color: #64748b; }
        .step-time { font-size: 0.65rem; color: #94a3b8; display: block; }

        .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        /* Lightbox styling */
        .lightbox-modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; flex-direction: column; }
        .lightbox-content { max-width: 90%; max-height: 80%; border-radius: 12px; }
        .lightbox-caption { color: white; margin-top: 20px; font-weight: 600; font-size: 1.2rem; }
        .close-lightbox { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }

        @media (max-width: 900px) {
            .card-content { grid-template-columns: 1fr; }
            .info-row { grid-template-columns: 1fr 1fr; display: grid; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="sidebar">
            <h2>StraySouls Admin</h2>
            <ul>
                <li><a href="admin.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="admin-reports.html"><i class="fas fa-exclamation-circle"></i> Reports</a></li>
                <li><a href="resolved-reports.html" class="active"><i class="fas fa-check-circle"></i> Resolved Reports</a></li>
                <li><a href="admin-shelters.html"><i class="fas fa-home"></i> Shelters</a></li>
                <li><a href="admin-volunteers.html"><i class="fas fa-users"></i> Volunteers</a></li>
                <li><a href="index.html" onclick="logout()" style="margin-top: 3rem; color: #f87171;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="dashboard-header">
                <div class="header-info">
                    <h1>Resolved Reports</h1>
                    <p>Auditing the success and safety of our rescued souls</p>
                </div>
                <div class="stats-summary">
                    <div class="resolved-counter">
                        <span>Total Resolved Cases</span>
                        <strong id="total-count">0</strong>
                    </div>
                </div>
            </div>

            <div class="filters-bar">
                <div class="filter-group">
                    <label>Search Animal</label>
                    <input type="text" id="filter-type" class="filter-control" placeholder="e.g. Dog, Cat..." oninput="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>Urgency</label>
                    <select id="filter-urgency" class="filter-control" onchange="applyFilters()">
                        <option value="all">All Urgencies</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>From Date</label>
                    <input type="date" id="filter-from" class="filter-control" onchange="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>To Date</label>
                    <input type="date" id="filter-to" class="filter-control" onchange="applyFilters()">
                </div>
                <button class="btn-export" onclick="exportToCSV()">
                    <i class="fas fa-file-export"></i> Export CSV
                </button>
            </div>

            <div id="resolved-list" class="resolved-grid">
                <!-- Skeleton cards -->
                <div class="resolved-card">
                    <div class="status-top skeleton" style="height: 40px;"></div>
                    <div class="card-content">
                        <div class="skeleton" style="height: 220px; border-radius: 12px;"></div>
                        <div class="skeleton" style="height: 220px; border-radius: 12px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal" onclick="event.target.id === 'lightbox' ? closeLightbox() : null">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        const API_BASE = (window.location.port === '5500' || window.location.protocol === 'file:') ? 'http://localhost:3000' : '';
        const socket = io(API_BASE);
        let resolvedData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            checkAdminAuth();
            await fetchResolvedReports();

            socket.on('reportResolved', async (data) => {
                showToast(`New case resolved: ${data.animalType}!`, 'success');
                await fetchResolvedReports();
            });
        });

        function checkAdminAuth() {
            const token = localStorage.getItem('straySoulsToken');
            const user = JSON.parse(localStorage.getItem('straySoulsUser') || '{}');
            if (!token || user.role !== 'admin') {
                window.location.href = 'login.html';
            }
        }

        async function fetchResolvedReports() {
            const token = localStorage.getItem('straySoulsToken');
            try {
                const res = await fetch(`${API_BASE}/api/reports/resolved`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                resolvedData = await res.json();
                document.getElementById('total-count').textContent = resolvedData.length;
                applyFilters();
            } catch (err) {
                console.error(err);
                document.getElementById('resolved-list').innerHTML = `<p style="text-align:center; color: #ef4444; padding: 3rem;">Unable to load resolved reports. Please refresh.</p>`;
            }
        }

        function applyFilters() {
            const typeQ = document.getElementById('filter-type').value.toLowerCase();
            const urgencyQ = document.getElementById('filter-urgency').value;
            const fromQ = document.getElementById('filter-from').value;
            const toQ = document.getElementById('filter-to').value;

            const filtered = resolvedData.filter(item => {
                const report = item.report;
                const matchType = report.animalType.toLowerCase().includes(typeQ);
                const matchUrgency = urgencyQ === 'all' || report.urgency === urgencyQ;
                
                const reportDate = new Date(report.resolvedAt).toISOString().split('T')[0];
                const matchFrom = !fromQ || reportDate >= fromQ;
                const matchTo = !toQ || reportDate <= toQ;

                return matchType && matchUrgency && matchFrom && matchTo;
            });

            renderList(filtered);
        }

        function renderList(list) {
            const container = document.getElementById('resolved-list');
            if (list.length === 0) {
                container.innerHTML = `
                <div style="text-align: center; padding: 4rem; background: white; border-radius: 16px;">
                    <i class="fas fa-search fa-3x" style="color: #cbd5e1; margin-bottom: 1rem;"></i>
                    <h3 style="color: #64748b;">No resolved reports match your search criteria.</h3>
                </div>`;
                return;
            }

            container.innerHTML = list.map(item => {
                const r = item.report;
                const t = item.task;
                const origImg = r.image ? (r.image.startsWith('http') ? r.image : `${API_BASE}/${r.image.replace(/^\//, '')}`) : '';
                
                return `
                <div class="resolved-card" onclick="toggleTimeline('${r._id}')">
                    <div class="status-top">
                        <div class="status-label">
                            <i class="fas fa-check-circle"></i> RESOLVED
                            <span style="color: #94a3b8; font-weight: 500; font-size: 0.8rem; margin-left:10px;">#${r._id.substring(0,8)}</span>
                        </div>
                        <span class="urgency-badge badge-${r.urgency}">${r.urgency.toUpperCase()}</span>
                    </div>
                    <div class="card-content">
                        <div class="img-stack">
                            <p>INITIAL REPORT IMAGE</p>
                            <img src="${origImg}" class="resolved-img" onclick="event.stopPropagation(); openLightbox(this.src, 'Initial Condition of Report #${r._id.substring(0,6)}')">
                        </div>
                        <div class="img-stack">
                            <p>VOLUNTEER COMPLETION PROOF</p>
                            <img src="${t?.completionProof?.imageUrl || ''}" class="resolved-img" onclick="event.stopPropagation(); openLightbox(this.src, 'Completion Proof for Report #${r._id.substring(0,6)}')">
                        </div>
                    </div>
                    <div style="padding: 0 20px 20px;">
                        <div class="info-row">
                            <div class="info-item">
                                <label>Animal Type</label>
                                <p>${r.animalType.toUpperCase()}</p>
                            </div>
                            <div class="info-item">
                                <label>Location</label>
                                <p>${r.location.address || 'Coordinates Only'}</p>
                            </div>
                            <div class="info-item">
                                <label>Resolved By</label>
                                <p>${r.resolvedBy?.name || 'Volunteer'}</p>
                            </div>
                            <div class="info-item">
                                <label>Resolved At</label>
                                <p>${new Date(r.resolvedAt).toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="volunteer-note">
                            ${t?.completionProof?.note || "The animal was successfully treated and secured according to established rescue protocols."}
                        </div>
                    </div>
                    <div id="timeline-${r._id}" class="timeline-box" onclick="event.stopPropagation()">
                        <div style="font-weight: 700; color: #1e293b; margin-bottom: 25px; font-size: 0.95rem; border-bottom: 1px solid #eee; padding-bottom: 10px;">CASE LIFECYCLE TIMELINE</div>
                        <div class="timeline">
                            <div class="timeline-step active">
                                <div class="step-marker"></div>
                                <span class="step-label">Reported</span>
                                <span class="step-time">${new Date(r.createdAt).toLocaleDateString()}</span>
                            </div>
                            <div class="timeline-step active">
                                <div class="step-marker"></div>
                                <span class="step-label">Assigned</span>
                                <span class="step-time">Volunteer Notified</span>
                            </div>
                            <div class="timeline-step active">
                                <div class="step-marker"></div>
                                <span class="step-label">In Progress</span>
                                <span class="step-time">Action Taken</span>
                            </div>
                            <div class="timeline-step active">
                                <div class="step-marker"></div>
                                <span class="step-label">Verified</span>
                                <span class="step-time">${new Date(r.resolvedAt).toLocaleTimeString()}</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function toggleTimeline(id) {
            const el = document.getElementById(`timeline-${id}`);
            const cards = document.querySelectorAll('.timeline-box');
            cards.forEach(c => { if(c.id !== `timeline-${id}`) c.style.display = 'none'; }); // Close others
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function openLightbox(src, title) {
            const l = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').textContent = title;
            l.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function exportToCSV() {
            if(resolvedData.length === 0) {
                showToast('No data to export', 'error');
                return;
            }
            let csv = 'Report ID,Animal Type,Urgency,Location,Resolved By,Resolved At,Volunteer Note,Proof Image URL\r\n';
            
            resolvedData.forEach(item => {
                const r = item.report;
                const t = item.task;
                const row = [
                    r._id,
                    r.animalType,
                    r.urgency,
                    `"${r.location.address || 'N/A'}"`,
                    r.resolvedBy?.name || 'Volunteer',
                    new Date(r.resolvedAt).toLocaleString(),
                    `"${(t?.completionProof?.note || '').replace(/"/g, '""')}"`,
                    t?.completionProof?.imageUrl || ''
                ];
                csv += row.join(',') + '\r\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `StraySouls_Resolved_Reports_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
